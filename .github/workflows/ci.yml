name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 7 * * *'   # 每日夜间:加重浸泡
  workflow_dispatch:

# 容器化构建:每个 job 都在 Dockerfile.ci 构建出的同一镜像里跑 scripts/ci.sh。
# 本地用 scripts/local-ci.sh 跑的是同一镜像、同一脚本——「本地能过」⟺「CI 能过」
# 由构造保证,不再有「本机能过、CI 不行」。

jobs:
  ci:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, asan, tsan, fuzz, bench]
    steps:
      - uses: actions/checkout@v4
      - name: Build CI image
        run: docker build -f Dockerfile.ci -t rain-ci .
      - name: Run ${{ matrix.variant }}
        run: docker run --rm -v "$PWD":/w -w /w rain-ci bash scripts/ci.sh ${{ matrix.variant }}

  soak-nightly:
    name: soak-nightly
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build CI image
        run: docker build -f Dockerfile.ci -t rain-ci .
      - name: Heavy soak under TSan
        run: docker run --rm -e RAIN_SOAK_ITERS=8000 -v "$PWD":/w -w /w rain-ci bash scripts/ci.sh soak
